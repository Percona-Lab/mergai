name: Coverage comment

# Runs after the Test workflow finishes and posts / updates the coverage
# comment on the pull request. This lives in a separate workflow_run workflow
# so it has write permissions even for pull requests opened from forks (which
# only get a read-only token in the Test workflow itself).

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

jobs:
  post-comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
      contents: write
      actions: read
    steps:
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
